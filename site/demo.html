<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A14 · 应用界面演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#263244;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.top{height:60px;background:white;border-bottom:1px solid #e6ebf1;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:700;display:flex;align-items:center;gap:10px}.logo{background:#246bfd;color:white;padding:7px 6px;border-radius:6px;font-size:11px}.brand small{display:block;color:#98a3b1;font-size:10px;font-weight:400}.demo{color:#3d9967;background:#edf8f1;border-radius:20px;padding:5px 10px;font-size:11px}.shell{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 60px)}aside{background:white;border-right:1px solid #e7ebf0;padding:18px 11px}.cap{font-size:10px;color:#9ba6b4;margin:15px 12px 8px;letter-spacing:1px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#667487;border-radius:5px;padding:10px 12px;margin:2px 0;cursor:pointer;font-size:13px}.nav:hover{background:#f5f8fc}.nav.on{background:#edf3ff;color:#246bfd;font-weight:650}.nav i{font-style:normal;display:inline-block;width:24px}.note{font-size:10px;color:#8390a0;border:1px solid #e5edf8;background:#f8faff;padding:11px;border-radius:6px;margin:24px 4px;line-height:1.7}.main{padding:23px 28px;max-width:1400px;width:100%;margin:auto}.crumb{font-size:11px;color:#96a1af;margin-bottom:15px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.head h1{font-size:20px;margin:0}.head p{font-size:11px;color:#8c97a5;margin:4px 0 0}.btn{border:1px solid #dce3eb;background:#fff;border-radius:4px;padding:7px 11px;color:#536276;font-size:11px;cursor:pointer}.primary{background:#246bfd;color:white;border-color:#246bfd}.cards{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:14px}.card{background:#fff;border:1px solid #e7ebf0;border-radius:6px;min-width:0;box-shadow:0 2px 10px #22 ;margin-top:3px}.alert{background:#f3faf5;border:1px solid #dcefe2;color:#43865e;padding:10px;border-radius:4px;font-size:11px;margin-top:12px}.toast{position:fixed;right:20px;top:72px;background:#23382f;color:#fff;padding:10px 14px;border-radius:5px;font-size:11px;display:none}.toast.show{display:block}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{position:sticky;top:60px;z-index:4;display:flex;overflow:auto;padding:5px;border-bottom:1px solid #e6ebf1}.cap,.note{display:none}.nav{flex:none;width:auto;padding:9px;font-size:11px}.main{padding:17px 12px}.stats{grid-template-columns:1fr 1fr}.two,.cols{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><div class="brand"><span class="logo">A14</span><span>智能体 · 数据优选与闭环寻优<small>流程工业建模数据平台</small></span></div><span class="demo">● 静态演示 · 样例数据</span></header><div class="shell"><aside><div class="cap">工作空间</div><button class="nav on" data-id="home"><i>▦</i>工作台</button><button class="nav" data-id="data"><i>▤</i>数据集</button><button class="nav" data-id="analysis"><i>⌁</i>预处理分析</button><button class="nav" data-id="agent"><i>✳</i>Agent 工作台</button><button class="nav" data-id="reports"><i>▧</i>分析报告</button><div class="cap">系统管理</div><button class="nav" data-id="kb"><i>▣</i>企业知识库</button><button class="nav" data-id="settings"><i>⚙</i>算法模板</button><div class="note"><b>静态演示说明</b><br>页面展示项目主要模块和样例结果。上传、后台寻优和真实报告需要连接项目服务。</div></aside><main class="main"><div class="crumb">A14 智能体系统　/　<span id="crumb">工作台</span></div><div id="content"></div></main></div><div class="toast" id="toast"></div><script>
const names={home:'工作台',data:'数据集',analysis:'预处理分析',agent:'Agent 工作台',reports:'分析报告',kb:'企业知识库',settings:'算法模板'},$=s=>document.querySelector(s);const chart=()=>`<div class="chart"><svg viewBox="0 0 600 190" preserveAspectRatio="none"><g class="grid"><path d="M0 25H600M0 65H600M0 105H600M0 145H600M100 0V160M220 0V160M340 0V160M460 0V160"/></g><path class="line" d="M0 140 C25 138 35 112 58 118 S90 155 115 134 S145 65 169 80 S205 140 230 119 S257 53 283 66 S315 144 339 119 S373 82 395 90 S428 143 452 113 S480 57 505 72 S540 129 560 99 S581 52 600 61"/><path class="line2" d="M0 148 C25 142 35 119 58 124 S90 149 115 139 S145 70 169 87 S205 134 230 124 S257 60 283 74 S315 139 339 124 S373 87 395 96 S428 137 452 120 S480 63 505 78 S540 123 560 106 S581 58 600 68"/></svg></div>`;const rows=arr=>`<div class="table"><table><thead><tr>${['编号','数据集','状态','最优 FIT','当前阶段','创建时间'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${arr.map((r,i)=>`<tr><td>#A14-0${24-i}</td><td>${r}</td><td><span class="tag">已完成</span></td><td><b>${[92.8,88.6,84.1,79.5][i]}%</b></td><td>评估交付</td><td>2026-10-${14-i} 16:42</td></tr>`).join('')}</tbody></table></div>`;const head=(t,d,a='')=>`<div class="head"><div><h1>${t}</h1><p>${d}</p></div>${a}</div>`,card=(t,b)=>`<section class="card"><div class="bar">${t}</div>${b}</section>`,stat=(items)=>`<div class="cards stats">${items.map(x=>`<div class="card stat"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]||'演示样例'}</span></div>`).join('')}</div>`;const tableData=[['DS-008','精馏塔仿真数据','3,000','8','时序模拟'],['DS-007','反应器温控数据','2,400','6','CSV 上传'],['DS-006','换热网络运行数据','5,120','11','CSV 上传'],['DS-005','常减压装置数据','1,800','7','时序模拟']];
const views={home:()=>`${head('流程工业数据优选工作台','欢迎回来，系统管理员 · 数据处理与闭环寻优概况',`<button class="btn primary" onclick="go('agent')">＋ 新建 Agent 任务</button>`)}${stat([['数据集总数','8','模拟与上传数据集'],['运行中任务','1','正在执行参数寻优'],['已完成任务','24','成功率 96.0%'],['历史最佳 FIT','92.8%','精馏塔仿真数据']])}<div class="cards two">${card('快速开始 · 从数据到模型交付',`<div class="body steps">${['生成 / 上传数据','数据质量分析','提交寻优任务','查看评估报告'].map((x,i)=>`<div class="step"><i class="num">${i+1}</i><b>${x}</b><small>${['建模数据集','异常与动态区间','Agent 自动编排','结果与数据交付'][i]}</small></div>`).join('')}</div>`)}${card('FIT 指标趋势 · 最近 7 次任务',`<div class="body">${chart()}<small>━ FIT 指标　 ┄ 基线水平</small></div>`)}</div><div style="margin-top:14px">${card('最近任务',rows(['精馏塔仿真数据','反应器温控数据','换热网络运行数据']))}</div>`,
data:()=>`${head('数据集','管理模拟生成与上传的流程工业时序数据',`<button class="btn" onclick="notice('静态样例：上传功能需连接后端')">↑ 上传 CSV</button> <button class="btn primary" onclick="notice('演示数据集已就绪')">＋ 生成模拟数据</button>`)}${stat([['数据集总数','8','4 个模拟 · 4 个上传'],['累计数据行数','26,481','有效时序样本'],['平均变量数','8.4','输入与目标变量'],['质量检查通过','7 / 8','1 个数据集建议清洗']])}${card('数据集列表 · 演示样例',`<div class="table"><table><thead><tr><th>编号</th><th>数据名称</th><th>样本数</th><th>变量数</th><th>来源</th><th>创建时间</th><th>状态</th><th></th></tr></thead><tbody>${tableData.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>2026-10-${14-i} 16:30</td><td><span class="tag ${i===3?'orange':''}">${i===3?'待检查':'可用'}</span></td><td><button class="btn" onclick="go('analysis')">数据概览</button></td></tr>`).join('')}</tbody></table></div>`)}`,
analysis:()=>`${head('预处理分析','时序数据清洗、动态段优选、时滞与共线性处理效果',`<button class="btn">DS-008 精馏塔仿真数据　⌄</button>`)}${stat([['原始样本','3,000','采样周期 1 秒'],['清洗后样本','2,864','异常值插值回填'],['优选动态段','6','共 1,842 个样本'],['质量综合评分','87 / 100','满足建模要求']])}<div class="cards two">${card('清洗前后趋势对比',`<div class="body">${chart()}<div class="alert">识别 136 个异常点并完成插值；提取 6 段高动态区间用于建模。</div></div>`)}${card('数据质量评分',`<div class="body">${[['数据完整度',98],['异常韧性',91],['动态信息',84],['变量独立性',76]].map(x=>`<p>${x[0]} <b style="float:right">${x[1]}</b></p><div style="height:6px;background:#edf0f4"><i style="display:block;width:${x[1]}%;height:100%;background:#4f88ef"></i></div>`).join('')}<div class="alert">回流比与进料流量相关性较高，建议检查变量冗余。</div></div>`)}</div><div class="cards two" style="margin-top:14px">${card('时滞估算结果',`<div class="body">进料流量　5 s　相关系数 0.82　<span class="tag">已对齐</span><hr>蒸汽流量　12 s　相关系数 0.76　<span class="tag">已对齐</span></div>`)}${card('共线性识别',`<div class="body"><div class="quality"><div class="tile"><small>检查变量</small><strong>7</strong></div><div class="tile"><small>强相关变量对</small><strong>1</strong></div></div><p>候选剔除：<span class="tag orange">回流比 ↔ 进料流量</span></p></div>`)}</div>`,
agent:()=>`${head('Agent 工作台','配置数据与寻优参数，查看自动编排计划') }<div class="cards two">${card('创建闭环寻优任务',`<div class="body"><div class="field"><label>选择数据集</label><select class="input"><option>DS-008　精馏塔仿真数据（3,000 行）</option><option>DS-007　反应器温控数据</option></select></div><div class="field"><label>任务指令</label><textarea class="input" rows="3">清洗异常，提取高信噪比动态段，处理时滞与共线性并闭环寻优。</textarea></div><div class="cols"><div class="field"><label>目标变量</label><select class="input"><option>产品纯度</option></select></div><div class="field"><label>输入变量</label><select class="input"><option>自动选择（6 个候选）</option></select></div><div class="field"><label>寻优迭代次数</label><input class="input" value="10"></div><div class="field"><label>动态窗口长度</label><input class="input" value="40"></div></div><div class="alert">静态演示不会提交后台任务。点击按钮查看流程效果。</div><button class="btn primary" style="margin-top:12px" onclick="simulate()">▶　运行演示流程</button><div id="result"></div></div>`)}${card('Agent 执行计划 · LangGraph',`<div class="body"><div class="alert" style="margin-top:0">已解析数据清洗、动态优选、时滞处理与闭环寻优意图。</div><div class="plan">${[['数据优选 Agent','异常清洗 → 动态评分 → 时滞对齐 → 共线性筛选'],['建模 Agent','候选模型评估与时序交叉验证'],['闭环寻优 Agent','以 FIT 为目标搜索预处理参数'],['评估交付 Agent','生成图表、报告与优选数据集']].map((x,i)=>`<div><b>0${i+1}　${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div>`)}</div><div style="margin-top:14px">${card('最近任务',rows(['精馏塔仿真数据','反应器温控数据','换热网络运行数据']))}</div>`,
reports:()=>`${head('分析报告与交付','查看闭环寻优实验结果、模型指标与交付文件') }<div class="cards two">${card('任务 #A14-024 · 实验结果',`<div class="body"><div class="quality">${[['闭环最优 FIT','92.8%'],['交叉验证 R²','0.914'],['优选样本','1,842'],['最优模型','Random Forest']].map(x=>`<div class="tile"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>${chart()}<p>本次实验筛选出 6 段高动态数据，验证集 FIT 为 92.8%，较基线提升 8.4%。</p></div>`)}${card('交付内容',`<div class="body">${['评估报告 PDF','优选数据 CSV','最优参数 JSON'].map(x=>`<button class="btn" style="width:100%;margin:5px 0" onclick="notice('静态演示不提供文件下载')">⇩　${x}</button>`).join('')}<small>实际文件由项目后端任务生成。</small></div>`)}</div><div style="margin-top:14px">${card('已完成实验',rows(['精馏塔仿真数据','反应器温控数据','换热网络运行数据']))}</div>`,
kb:()=>`${head('企业知识库','文档上传、向量入库与知识问答界面预览')}${stat([['已入库文档','18'],['向量分片','1,246'],['Embedding 模型','BGE-M3'],['问答服务','已就绪']])}<div class="cards two">${card('知识文档列表',`<div class="body">精馏塔操作规程.pdf　·　184 个分片<hr>装置工艺指标说明.docx　·　76 个分片<hr>安全生产规范.pdf　·　218 个分片</div>`)}${card('知识问答预览',`<div class="body"><div class="alert" style="margin:0">问：如何判断模型数据是否适合建模？<br><br>答：检查采样完整度、动态区间分布与输入变量时滞。<br><br>引用：精馏塔操作规程.pdf · 第 12 节</div><input class="input" style="margin-top:12px" placeholder="输入工艺问题…"></div>`)}</div>`,
settings:()=>`${head('算法模板','预处理参数、工作流模板与全局运行设置预览') }<div class="cards two">${card('预处理参数模板',`<div class="body">精馏塔标准流程　·　IQR 1.5　·　窗口 40　·　阈值 0.50<hr>反应器温控优化　·　IQR 1.8　·　窗口 60　·　阈值 0.42<hr>通用高动态筛选　·　IQR 1.5　·　窗口 30　·　阈值 0.60</div>`)}${card('全局算法与运行设置',`<div class="body cols">${[['默认迭代次数','10'],['最大迭代次数','100'],['最大时滞搜索','30'],['共线性阈值','0.95']].map(x=>`<div class="field"><label>${x[0]}</label><input class="input" value="${x[1]}" readonly></div>`).join('')}<div class="alert">设置页面仅作效果展示。</div></div>`)}</div>`};function go(id){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.id===id));$('#crumb').textContent=names[id];$('#content').innerHTML=views[id]()}function notice(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}function simulate(){let r=$('#result');r.innerHTML='<div class="alert">演示运行中：清洗 → 动态优选 → 建模 → 闭环寻优…</div>';setTimeout(()=>{r.innerHTML='<div class="alert">演示完成：Random Forest · FIT 92.8% · 优选样本 1,842 行。静态样例结果。</div>';notice('演示任务已完成')},1100)}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.id));go('home');</script></main></body></html>
